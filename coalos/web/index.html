<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoalOS</title>
<link rel="stylesheet" href="/web/coalos.css">
</head>
<body>
<div id="desktop">
  <div id="icons"></div>
  <div id="drop-hint">Drop to copy into CoalOS</div>
</div>
<div id="windows"></div>
<div id="start-menu" hidden>
  <div class="sm-head"><div class="sm-avatar"></div><b>Coal</b></div>
  <div class="sm-body">
    <div class="sm-left" id="sm-apps"></div>
    <div class="sm-right">
      <div class="sm-item" data-open="/home/Documents"><span class="ico" data-ico="folder"></span>My Documents</div>
      <div class="sm-item" data-open="/home/Pictures"><span class="ico" data-ico="folder"></span>My Pictures</div>
      <div class="sm-item" data-open="/home/Music"><span class="ico" data-ico="folder"></span>My Music</div>
      <div class="sm-item" data-open="/home"><span class="ico" data-ico="computer"></span>My Computer</div>
      <div class="sm-sep"></div>
      <div class="sm-item" data-app="about"><span class="ico" data-ico="info"></span>About this computer</div>
    </div>
  </div>
  <div class="sm-foot"><span>This computer is pretend. Nothing here touches the real one.</span></div>
</div>
<div id="taskbar">
  <button id="start"><i></i>start</button>
  <div id="tasks"></div>
  <div id="tray"><span class="meter" id="ram" title="Memory in use (pretend: 512 MB)">RAM <b><i></i></b></span><span class="meter" id="cpu" title="Processor (pretend: one slow core)">CPU <b><i></i></b></span><span id="disk" title="Pretend disk used, and its real size on the laptop"></span><span id="clock"></span></div>
</div>
<div id="menu" hidden></div>
<script src="/web/coalos.js"></script>
</body>
</html>
