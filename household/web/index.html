<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household</title>
<style>
  :root {
    --bg: #14130f; --panel: #1d1b16; --panel2: #25221b; --line: #34302600;
    --edge: #37322a; --text: #efe8da; --dim: #a39a88; --faint: #6d6658;
    --warm: #e9a75b; --ok: #8fc49a; --bad: #e57a6a; --away: #8ea6d6;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--edge);
    background: var(--panel2); border-radius: 10px; padding: 8px 14px; }
  button:hover { border-color: var(--warm); }
  button:disabled { opacity: .4; cursor: default; }
  .app { display: grid; grid-template-columns: 300px 1fr 260px; gap: 16px; height: 100%; padding: 16px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 4px 2px 0; font-weight: 600; }

  /* household */
  .clock { background: var(--panel); border-radius: var(--r); padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .clock b { font-size: 28px; font-weight: 600; }
  .clock span { color: var(--dim); font-size: 13px; }
  .person { background: var(--panel); border-radius: var(--r); padding: 14px 16px; border-left: 4px solid var(--ok); }
  .person.hurt { border-left-color: var(--bad); }
  .person.unwell { border-left-color: var(--warm); }
  .person.away { border-left-color: var(--away); }
  .person.dead { border-left-color: var(--faint); opacity: .6; }
  .person .top { display: flex; justify-content: space-between; align-items: center; }
  .person .name { font-weight: 600; font-size: 17px; }
  .person .says { margin: 6px 0 8px; }
  .person .truth { color: var(--faint); font-size: 12.5px; }
  .person .truth.hidden { display: none; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--panel2); color: var(--dim); }
  .person .away-btn { padding: 3px 10px; font-size: 12px; }
  .doing { background: var(--panel2); border-radius: var(--r); padding: 12px 16px; color: var(--warm); }

  /* talk */
  .talk { background: var(--panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; }
  .msg.you { align-self: flex-end; background: #3a2f1f; }
  .msg.brain { align-self: flex-start; background: var(--panel2); }
  .msg.act, .msg.note { align-self: center; background: none; color: var(--faint); font-size: 13px; padding: 2px; }
  .msg small { display: block; color: var(--faint); font-size: 11px; }
  .empty { margin: auto; text-align: center; color: var(--faint); max-width: 380px; }
  .bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--edge); }
  .bar input { flex: 1; background: var(--bg); border: 1px solid var(--edge); color: var(--text);
    border-radius: 10px; padding: 10px 14px; font: inherit; outline: none; }
  .bar input:focus { border-color: var(--warm); }
  .mic { width: 46px; padding: 0; display: grid; place-items: center; }
  .mic.on { background: var(--bad); border-color: var(--bad); }
  .time { display: flex; gap: 8px; }
  .time button { flex: 1; }
  .time select { background: var(--panel2); color: var(--text); border: 1px solid var(--edge); border-radius: 10px; padding: 0 10px; font: inherit; }
  .time .go { background: var(--warm); color: #1a1408; border-color: var(--warm); font-weight: 600; }

  /* senses */
  .sense { background: var(--panel); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .sense .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
  .sense.on .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .sense .what { flex: 1; }
  .sense .what b { display: block; font-weight: 600; }
  .sense .what span { color: var(--dim); font-size: 12.5px; }
  .switch { width: 40px; height: 22px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--edge); position: relative; padding: 0; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: .15s; }
  .switch.on { background: #2d4a33; } .switch.on::after { left: 20px; background: var(--ok); }
  video { width: 100%; border-radius: var(--r); background: #000; display: none; }
  .foot { color: var(--faint); font-size: 12px; margin-top: auto; padding: 0 2px; }
  label.truthbox { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; padding: 0 2px; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .talk { min-height: 60vh; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="col">
    <h2>The house</h2>
    <div class="clock"><b id="hour">Hour 0</b><span id="stores"></span></div>
    <div id="people" class="col"></div>
    <div class="doing" id="doing"></div>
    <label class="truthbox"><input type="checkbox" id="truth"> Show what's really true (to check it)</label>
  </section>

  <section class="col">
    <h2>Talk</h2>
    <div class="talk">
      <div class="log" id="log"><div class="empty">Tell it how someone feels - "Ada has a headache", "Bayo can't breathe" - or warn it: "no, it's a trap".<br><br>Time only moves when you press a button, so take as long as you like.</div></div>
      <div class="bar">
        <button class="mic" id="mic" title="Hold to speak" disabled>&#127908;</button>
        <input id="text" placeholder="Say something about someone..." autocomplete="off">
        <button id="send">Send</button>
      </div>
    </div>
    <div class="time">
      <button class="go" data-h="1">+1 hour</button>
      <button data-h="6">+6 hours</button>
      <button data-h="24">+1 day</button>
      <select id="danger" title="A danger only you know about - the brain can't see it">
        <option value="">No danger</option></select>
      <button id="reset">New house</button>
    </div>
  </section>

  <section class="col">
    <h2>Senses</h2>
    <div id="senses" class="col"></div>
    <video id="cam" autoplay muted playsinline></video>
    <div class="foot">Everything runs on this machine. Nothing is sent anywhere.</div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
let state = null, devices = { camera: false, mic: false, speaker: false };
let use = { eyes: true, ears: true, speaker: false };
let camStream = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function mood(p) {
  if (!p.alive) return "dead";
  if (p.away && !p.in_sight) return "away";
  if (p.truth.includes("hurt") && $("#truth").checked) return "hurt";
  const s = p.it_says;
  if (/badly hurt|died/.test(s)) return "hurt";
  if (/ is /.test(s)) return "unwell";
  return "";
}

function render(s) {
  state = s;
  $("#hour").textContent = `Day ${Math.floor(s.hour / 24) + 1}, hour ${s.hour % 24}`;
  $("#stores").textContent = `in the ${s.here}${s.caught ? " (stuck!)" : ""} · battery ${Math.round(s.power * 100)}% · food ${s.store}`;
  $("#doing").textContent = s.doing;
  $("#people").innerHTML = s.people.map((p, i) => `
    <div class="person ${mood(p)}">
      <div class="top"><span class="name">${p.name} <span class="chip">${s.rooms[i]}</span></span>
        ${p.alive ? `<button class="away-btn" data-who="${i}" data-away="${!p.away}">${p.away ? "Bring back" : "Send to another room"}</button>` : `<span class="chip">died</span>`}</div>
      <div class="says">${p.it_says}</div>
      ${p.told.length ? `<span class="chip">said: ${p.told.join(", ")}</span>` : ""}
      <div class="truth ${$("#truth").checked ? "" : "hidden"}">truth: ${p.truth.join(", ")} · health ${Math.round(p.health * 100)}%</div>
    </div>`).join("");
  document.querySelectorAll(".away-btn").forEach(b => b.onclick = async () =>
    render(await api("/api/away", { who: +b.dataset.who, away: b.dataset.away === "true" })));
  const log = $("#log");
  if (s.events.length) {
    log.innerHTML = s.events.map(e => `<div class="msg ${e.kind}">${e.kind === "act" ? `hour ${e.hour} · ` : ""}${e.text}</div>`).join("");
    log.scrollTop = log.scrollHeight;
  }
  const sel = $("#danger");
  if (sel.options.length === 1) s.all_rooms.slice(1).forEach(r => sel.add(new Option(`Danger in the ${r}`, r)));
  sel.value = s.danger || "";
  renderSenses();
}

function renderSenses() {
  const rows = [
    ["eyes", "Eyes", devices.camera ? "Camera found" : "No camera - it cares without sight", devices.camera],
    ["ears", "Ears", devices.mic ? "Microphone found - hold the mic to speak" : "No microphone", devices.mic],
    ["speaker", "Voice", devices.speaker ? "It says its replies aloud" : "No speaker found", devices.speaker],
    ["words", "Words", "Typing - always there", true],
  ];
  $("#senses").innerHTML = rows.map(([k, name, note, has]) => {
    const on = k === "words" ? true : has && use[k];
    return `<div class="sense ${on ? "on" : ""}"><div class="dot"></div>
      <div class="what"><b>${name}</b><span>${note}</span></div>
      ${k !== "words" && has ? `<button class="switch ${use[k] ? "on" : ""}" data-k="${k}" title="attach / detach"></button>` : ""}</div>`;
  }).join("");
  document.querySelectorAll(".switch").forEach(b => b.onclick = () => { use[b.dataset.k] = !use[b.dataset.k]; applySenses(); });
  $("#mic").disabled = !(devices.mic && use.ears);
}

async function applySenses() {
  const eyes = devices.camera && use.eyes, ears = devices.mic && use.ears;
  // the camera feed is shown so you know it is attached; the brain's eyes see the household
  if (eyes && !camStream) {
    try { camStream = await navigator.mediaDevices.getUserMedia({ video: true }); $("#cam").srcObject = camStream; $("#cam").style.display = "block"; }
    catch { devices.camera = false; }
  } else if (!eyes && camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; $("#cam").style.display = "none"; }
  render(await api("/api/senses", { eyes, ears, nose: eyes }));
}

async function findDevices() {
  try {
    const list = await navigator.mediaDevices.enumerateDevices();
    devices.camera = list.some(d => d.kind === "videoinput");
    devices.mic = list.some(d => d.kind === "audioinput");
    devices.speaker = list.some(d => d.kind === "audiooutput") || !!window.AudioContext;
  } catch { /* no media devices: words only */ }
  use.speaker = devices.speaker && use.speaker;
  await applySenses();
}

async function voice(text) {
  if (!(devices.speaker && use.speaker)) return;
  const r = await fetch("/api/voice", { method: "POST", body: JSON.stringify({ text }) });
  if (r.ok) new Audio(URL.createObjectURL(await r.blob())).play();
}

async function send(text) {
  text = text.trim(); if (!text) return;
  $("#text").value = "";
  const out = await api("/api/say", { text });
  render(out.state);
  voice(out.reply);
}

// hold-to-talk: record while held, turn to text on this machine, then send
let rec = null, chunks = [];
async function startRec() {
  if (rec) return;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  rec = new MediaRecorder(stream); chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $("#mic").classList.remove("on"); $("#text").placeholder = "Listening...";
    const r = await fetch("/api/listen", { method: "POST", body: new Blob(chunks) });
    const j = await r.json(); $("#text").placeholder = "Say something about someone...";
    rec = null;
    if (j.text) { $("#text").value = j.text; send(j.text); }
  };
  rec.start(); $("#mic").classList.add("on");
}
$("#mic").onpointerdown = startRec;
["pointerup", "pointerleave"].forEach(ev => $("#mic").addEventListener(ev, () => rec && rec.state === "recording" && rec.stop()));

$("#send").onclick = () => send($("#text").value);
$("#text").onkeydown = e => { if (e.key === "Enter") send($("#text").value); };
document.querySelectorAll("[data-h]").forEach(b => b.onclick = async () => {
  b.disabled = true; render(await api("/api/hours", { n: +b.dataset.h })); b.disabled = false; voice(state.doing);
});
$("#danger").onchange = async e => render(await api("/api/danger", { room: e.target.value }));
$("#reset").onclick = async () => render(await api("/api/reset", {}));
$("#truth").onchange = () => render(state);
navigator.mediaDevices?.addEventListener?.("devicechange", findDevices);

api("/api/state").then(render).then(findDevices);
</script>
</body>
</html>
